<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif
}

html,body{
  min-height:100%;
  background:#000;
  color:#fff;
  overflow-x:hidden
}

/* =========================
   🌈 LIQUID BACKGROUND
========================= */

.liquid-bg{
  position:fixed;
  inset:0;
  z-index:-3;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(0,255,255,.25),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 15%,
      rgba(255,0,255,.25),
      transparent 35%
    ),
    radial-gradient(
      circle at 30% 70%,
      rgba(0,170,255,.25),
      transparent 40%
    ),
    radial-gradient(
      circle at 70% 80%,
      rgba(255,100,200,.25),
      transparent 40%
    ),
    linear-gradient(
      180deg,
      #050c14,
      #000
    );

  filter:blur(50px);
  animation:liquidFloat 22s ease-in-out infinite alternate
}

@keyframes liquidFloat{
  to{
    transform:scale(1.1)
  }
}

.overlay{
  position:fixed;
  inset:0;
  z-index:-2;
  background:rgba(0,0,0,.25)
}

/* =========================
   SCREENS
========================= */

.screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 0
}

.hidden{
  display:none
}

/* =========================
   LOGO
========================= */

.logo{
  width:110px;
  height:110px;
  border-radius:50%;
  position:relative;
  overflow:hidden;
  margin-bottom:18px
}

.logo img{
  width:100%;
  height:100%;
  border-radius:50%;
  z-index:2;
  position:relative;
  object-fit:cover
}

.logo::before{
  content:"";
  position:absolute;
  inset:-30%;

  background:
    radial-gradient(
      circle,
      rgba(0,255,255,.8),
      transparent 60%
    ),
    radial-gradient(
      circle,
      rgba(255,0,255,.8),
      transparent 60%
    );

  filter:blur(25px);
  animation:spin 6s linear infinite;
  z-index:1
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

/* =========================
   GLASS CARD
========================= */

.glass{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-radius:28px;

  box-shadow:
    0 0 40px rgba(0,255,255,.25),
    0 0 80px rgba(255,0,255,.15)
}

/* =========================
   WELCOME
========================= */

.welcome{
  font-size:32px;
  font-weight:900;
  text-align:center;

  background:
    linear-gradient(
      120deg,
      #00ffff,
      #ff00ff,
      #00ffff
    );

  background-size:300% 300%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:textFlow 6s ease infinite
}

@keyframes textFlow{

  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }

}

/* =========================
   SEARCH
========================= */

.search-row{
  width:90%;
  max-width:720px;

  display:flex;
  gap:14px;

  margin:20px 0
}

.search-row input{
  flex:1;

  padding:14px 18px;

  border:none;
  outline:none;

  border-radius:999px;

  background:rgba(255,255,255,.14);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  color:#fff;

  box-shadow:
    0 0 25px rgba(0,255,255,.35),
    0 0 45px rgba(255,0,255,.25);

  text-align:center
}

.search-row input::placeholder{
  color:rgba(255,255,255,.7)
}

.pill{
  width:160px;

  padding:14px 0;

  border-radius:999px;

  background:rgba(255,255,255,.14);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  color:#fff;

  box-shadow:
    0 0 25px rgba(0,255,255,.35),
    0 0 45px rgba(255,0,255,.25);

  text-align:center;

  font-weight:bold;

  cursor:pointer
}

/* =========================
   CATEGORY GRID
========================= */

.grid{
  width:90%;
  max-width:750px;

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:18px;

  margin-bottom:20px
}

/* =========================
   CATEGORY BUTTON
========================= */

.liquid-btn{
  height:130px;

  border-radius:26px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:900;

  cursor:pointer;

  position:relative;

  overflow:hidden
}

.liquid-btn::before{
  content:"";

  position:absolute;

  width:260%;
  height:260%;

  background:
    radial-gradient(
      circle at 30% 30%,
      #00ffff,
      transparent 60%
    ),
    radial-gradient(
      circle at 70% 70%,
      #ff00ff,
      transparent 60%
    );

  filter:blur(30px);

  animation:spin 7s linear infinite
}

.liquid-btn span{
  position:relative;
  z-index:1
}

/* =========================
   MOVIES
========================= */

.movies{
  width:90%;
  max-width:700px
}

/* =========================
   🎬 MOVIE CARD
========================= */

.movie{

  margin-top:14px;

  min-height:100px;

  padding:12px;

  border-radius:20px;

  background:rgba(255,255,255,.14);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  display:flex;

  align-items:stretch;

  gap:14px;

  overflow:hidden;

  box-shadow:
    0 0 20px rgba(0,255,255,.08),
    0 0 30px rgba(255,0,255,.06)
}

/* =========================
   🖼️ POSTER
========================= */

.poster{

  /*
    Poster width is controlled by
    JavaScript so it becomes equal
    to the movie card's inner height.
  */

  width:96px;
  min-width:96px;

  aspect-ratio:1 / 1;

  align-self:stretch;

  border-radius:15px;

  overflow:hidden;

  padding:3px;

  background:
    linear-gradient(
      135deg,
      rgba(0,255,255,.45),
      rgba(255,0,255,.45)
    );

  box-shadow:
    0 0 15px rgba(0,255,255,.20),
    0 0 25px rgba(255,0,255,.15)
}

.poster-img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  border-radius:12px
}

/* =========================
   POSTER FALLBACK
========================= */

.poster-fallback{

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:11px;
  font-weight:bold;

  color:rgba(255,255,255,.8);

  background:
    linear-gradient(
      135deg,
      rgba(0,255,255,.15),
      rgba(255,0,255,.15)
    )
}

/* =========================
   MOVIE CONTENT
========================= */

.movie-content{

  flex:1;

  min-width:0;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:3px 2px
}

.movie-name{

  font-size:16px;

  font-weight:bold;

  line-height:1.4;

  word-break:break-word
}

/* =========================
   WATCH BUTTON
========================= */

.play{

  margin-top:10px;

  padding:11px 12px;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #ff00ff,
      #00ffff
    );

  text-align:center;

  cursor:pointer;

  font-weight:bold;

  font-size:14px;

  box-shadow:
    0 0 15px rgba(0,255,255,.18),
    0 0 15px rgba(255,0,255,.18);

  transition:.2s
}

.play:active{
  transform:scale(.96)
}

/* =========================
   BACK BUTTON
========================= */

.back-btn{

  margin-bottom:16px;

  padding:10px 22px;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #00ffff,
      #ff00ff
    );

  cursor:pointer;

  font-weight:bold
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .welcome{
    font-size:25px
  }

  .search-row{
    gap:8px
  }

  .pill{
    width:115px
  }

  .grid{
    gap:12px
  }

  .liquid-btn{
    height:110px;
    font-size:17px
  }

  .movies{
    width:92%
  }

  .movie{
    gap:11px;
    padding:10px
  }

  .poster{
    width:85px;
    min-width:85px
  }

  .movie-name{
    font-size:14px
  }

  .play{
    font-size:13px;
    padding:9px
  }

}

/* Very small phones */

@media(max-width:360px){

  .poster{
    width:78px;
    min-width:78px
  }

  .movie{
    gap:9px
  }

  .movie-name{
    font-size:13px
  }

}

</style>

/* =====================================================
   GOOGLE DRIVE POSTER CONVERTER
===================================================== */

function getPosterUrl(url){

  if(!url){
    return "";
  }

  /*
    Google Drive:
    https://drive.google.com/file/d/FILE_ID/view

    becomes:
    https://drive.google.com/thumbnail?id=FILE_ID&sz=w500
  */

  const match = url.match(
    /\/file\/d\/([^/]+)/
  );

  if(match){

    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w500`;

  }

  /*
    If already direct image URL,
    use it directly.
  */

  return url;
}


/* =====================================================
   RENDER MOVIES
===================================================== */

function render(list,box){

  box.innerHTML="";

  if(list.length===0){

    box.innerHTML=`
      <div class="movie">
        <div class="movie-content">
          <div class="movie-name">
            No movies found
          </div>
        </div>
      </div>
    `;

    return;
  }


  list.forEach(m=>{

    const poster = getPosterUrl(m.poster);


    box.innerHTML += `

      <div class="movie">

        <div class="poster">

          ${
            poster

            ?

            `<img
              class="poster-img"
              src="${poster}"
              alt="${escapeHtml(m.name)}"
              loading="lazy"
              onerror="this.parentElement.innerHTML='<div class=&quot;poster-fallback&quot;>POSTER<br>NOT FOUND</div>'"
            >`

            :

            `<div class="poster-fallback">
              NO<br>POSTER
            </div>`
          }

        </div>


        <div class="movie-content">

          <div class="movie-name">
            ${escapeHtml(m.name)}
          </div>


          <div
            class="play"
            onclick="window.open('${m.link}','_blank')">

            ▶ WATCH

          </div>

        </div>

      </div>

    `;

  });


  /*
    Make poster height equal to
    movie card inner height.
  */

  requestAnimationFrame(()=>{

    box.querySelectorAll(".movie").forEach(movie=>{

      const poster = movie.querySelector(".poster");

      if(!poster) return;

      const movieHeight =
        movie.getBoundingClientRect().height;

      const padding =
        parseFloat(
          getComputedStyle(movie).paddingTop
        ) +
        parseFloat(
          getComputedStyle(movie).paddingBottom
        );

      const innerHeight =
        movieHeight - padding;

      poster.style.height =
        innerHeight + "px";

      poster.style.width =
        innerHeight + "px";

      poster.style.minWidth =
        innerHeight + "px";

    });

  });

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener("input",()=>{

  const q =
    search.value
      .toLowerCase()
      .trim();


  homeMovies.innerHTML="";


  if(!q){

    categoryGrid.style.display="grid";

    return;
  }


  categoryGrid.style.display="none";


  render(

    moviesData.filter(m=>
      m.name
        .toLowerCase()
        .includes(q)
    ),

    homeMovies

  );

});


/* =====================================================
   CATEGORY
===================================================== */

function openCategory(cat){

  if(
    cat==="K/C Drama" ||
    cat==="Series"
  ){

    home.classList.add("hidden");

    kcDrama.classList.remove("hidden");


    let data =
      moviesData.filter(
        m =>
          m.cat.toLowerCase() ===
          cat.toLowerCase()
      );


    let subs =
      [
        ...new Set(
          data
            .map(m=>m.sub)
            .filter(Boolean)
        )
      ];


    subBox.innerHTML="";


    subs.forEach(s=>{

      subBox.innerHTML += `

        <div
          class="liquid-btn"
          onclick="openSub(
            '${cat}',
            '${s.replace(/'/g,"\\'")}'
          )">

          <span>
            ${escapeHtml(s)}
          </span>

        </div>

      `;

    });

    return;
  }


  home.classList.add("hidden");

  category.classList.remove("hidden");


  render(

    moviesData

      .filter(
        m => m.cat === cat
      )

      .sort(
        (a,b)=>
          a.name.localeCompare(b.name)
      ),

    moviesBox

  );

}


/* =====================================================
   SUB CATEGORY
===================================================== */

function openSub(cat,sub){

  kcDrama.classList.add("hidden");

  category.classList.remove("hidden");


  render(

    moviesData

      .filter(
        m =>
          m.cat.toLowerCase() ===
          cat.toLowerCase() &&
          m.sub === sub
      )

      .sort(
        (a,b)=>
          a.name.localeCompare(b.name)
      ),

    moviesBox

  );

}


/* =====================================================
   RECENT
===================================================== */

function openRecent(){

  home.classList.add("hidden");

  recent.classList.remove("hidden");


  render(

    [...moviesData].reverse(),

    recentMovies

  );

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  category.classList.add("hidden");

  recent.classList.add("hidden");

  kcDrama.classList.add("hidden");

  home.classList.remove("hidden");


  homeMovies.innerHTML="";

  categoryGrid.style.display="grid";

  search.value="";

}


/* =====================================================
   RESIZE FIX
   Poster stays square and same height
===================================================== */

window.addEventListener("resize",()=>{

  document
    .querySelectorAll(".movie")
    .forEach(movie=>{

      const poster =
        movie.querySelector(".poster");

      if(!poster) return;


      const movieHeight =
        movie.getBoundingClientRect().height;


      const padding =
        parseFloat(
          getComputedStyle(movie).paddingTop
        ) +
        parseFloat(
          getComputedStyle(movie).paddingBottom
        );


      const innerHeight =
        movieHeight - padding;


      poster.style.height =
        innerHeight + "px";

      poster.style.width =
        innerHeight + "px";

      poster.style.minWidth =
        innerHeight + "px";

    });

});

</script>
